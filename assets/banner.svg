t="indefinite"/></circle><circle cx="90" cy="60" r="2"><animate attributeName="opacity" values=".1;.9;.1" dur="3s" repeatCount="indefinite"/></circle></g><text x="450" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#tx)">botgrid</text><text x="450" y="162" text-anchor="middle" font-family="ui-sans-serif,system-ui,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#ffffff" fill-opacity="0">Watch robots find their way: A*, Dijkstra, BFS, Greedy<animate attributeName="fill-opacity" values="0;.88" dur="2s" fill="freeze"/></text></svg>
